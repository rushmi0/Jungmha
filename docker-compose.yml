version: "3.9"

networks:
  dev_network:

services:

  jungmhaDB:
    container_name: jungmha-postgres
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: sql@min
    volumes:
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d/
    networks:
      - dev_network


  jungmha-native-image:
    container_name: jungmha-native-image
    image: ghcr.io/graalvm/graalvm-community:17.0.9
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - .:/app/source-code
    working_dir: /app/source-code
    command:
      - sh
      - -c
      - |
        chmod +x run_aot_app.sh; ./run_aot_app.sh
    networks:
      - dev_network


  jungmha-jvm-app:
    container_name: jungmha-jvm-app
    image: amazoncorretto:17
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - .:/app/source-code
    working_dir: /app/source-code
    command:
      - sh
      - -c
      - |
        chmod +x run_jit_app.sh; ./run_jit_app.sh
    networks:
      - dev_network


  cloudflared-tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token
