name: Build and Run Native Image

on:
  push:
    branches:
      - backend

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    services:
      jungmhaDB:
        image: postgres:15-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_PASSWORD: sql@min
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Build and Run Native Image
        uses: docker://ghcr.io/graalvm/graalvm-community:17.0.9
        with:
          args: bash -c 'chmod +x run_aot_app.sh && ./run_aot_app.sh'
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://jungmha-postgres:5432/postgres
