name: Build and Run Native Image

on:
  push:
    branches:
      - backend

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    services:
      jungmhaDB:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: sql@min
        ports:
          - 5432:5432
        options: --name jungmhaDB

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build native image
        run: |
          docker-compose build jungmha-native-image
          docker-compose up -d jungmhaDB
          docker-compose up jungmha-native-image
